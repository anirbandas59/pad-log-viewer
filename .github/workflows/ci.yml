name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Upload single-file HTML
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pad-log-viewer-pr-${{ github.event.pull_request.number }}
          path: dist/pad-log-viewer.html
          retention-days: 30
          if-no-files-found: error

  # Browser tests of the built app (Playwright). Separate from check so a slow browser
  # install never delays the main gate, and both results show on the PR.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.event.pull_request.number || github.run_id }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
