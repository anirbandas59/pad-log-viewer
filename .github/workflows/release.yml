name: Release

# A version tag (vX.Y.Z on main, matching package.json) builds the single HTML file, re-runs
# every check and browser test against it, and attaches it to a GitHub release, plain and
# zipped (the .zip is for estates that block .html downloads from SharePoint or Teams).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected."
            exit 1
          fi
      - run: npm run check
      - name: Browser tests, served and from file://
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Name the file after the version, and zip it
        run: |
          cp dist/pad-log-viewer.html "pad-log-viewer-$GITHUB_REF_NAME.html"
          zip -j "pad-log-viewer-$GITHUB_REF_NAME.zip" "pad-log-viewer-$GITHUB_REF_NAME.html"
      - name: Create the GitHub release with both files attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "pad-log-viewer-$GITHUB_REF_NAME.html" "pad-log-viewer-$GITHUB_REF_NAME.zip"
          --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
