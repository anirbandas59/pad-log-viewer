name: PR body footer

# Cloud sessions' GitHub proxy appends "---" and a "_Generated by [Claude Code](…)_" line to
# every PR body they write, and the session cannot remove it. CLAUDE.md allows no attribution
# in PR bodies, so this removes exactly that trailing footer whenever a PR is opened, edited,
# pushed to or labelled. It is deterministic on purpose: the earlier LLM step in review-pr
# missed it on #26. Its own edit uses GITHUB_TOKEN, which triggers no further workflow run.
on:
  pull_request:
    types: [opened, reopened, edited, synchronize, labeled]

permissions:
  pull-requests: write

concurrency:
  group: pr-body-footer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  strip:
    name: strip-footer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove the cloud footer from the PR body
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'EOF'
          const { GH_TOKEN, REPO, PR } = process.env
          // Trailing "---" line, then the footer line; blank lines around them allowed.
          const FOOTER = /\n*[ \t]*---[ \t]*\n+[ \t]*_Generated by \[Claude Code\]\([^)\n]*\)_[ \t]*\s*$/

          const url = `https://api.github.com/repos/${REPO}/pulls/${PR}`
          const headers = { authorization: `Bearer ${GH_TOKEN}`, accept: 'application/vnd.github+json' }
          const res = await fetch(url, { headers })
          if (!res.ok) throw new Error(`GET ${url}: HTTP ${res.status}`)
          const body = ((await res.json()).body ?? '').replace(/\r\n/g, '\n')
          if (!FOOTER.test(body)) {
            console.log('No cloud footer in the PR body.')
            process.exit(0)
          }
          const clean = body.replace(FOOTER, '').trimEnd() + '\n'
          const patch = await fetch(url, {
            method: 'PATCH',
            headers: { ...headers, 'content-type': 'application/json' },
            body: JSON.stringify({ body: clean }),
          })
          if (!patch.ok) throw new Error(`PATCH ${url}: HTTP ${patch.status}`)
          console.log(`Removed the cloud footer (${body.length - clean.length} characters).`)
          EOF
