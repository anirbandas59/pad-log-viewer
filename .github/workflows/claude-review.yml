name: Claude review

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read
  # gh pr checks reads check runs and commit statuses, so the reviewer can see CI.
  checks: read
  statuses: read

jobs:
  review:
    # Job-level, not workflow-level: a run whose job is skipped by `if` (e.g. the labeled event
    # from the reviewer's own relabel, or a push without ready-for-review) never joins the
    # group, so it can no longer cancel a review that is in progress.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'ready-for-review') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ready-for-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /review-pr ${{ github.event.pull_request.number }}
          claude_args: >-
            --model opus
            --allowedTools "Read,Grep,Glob,Task,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr list:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(npm run check:*),Write(/tmp/**)"
